name: Deploy to Amvera

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-amvera-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Push main to Amvera
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test before deployment (no database connection)
        run: |
          python -m pip install -r requirements.txt 'pytest>=8,<10'
          python -m pytest -q
          node --test tests/detail_js.test.cjs

      - name: Configure Amvera SSH key
        env:
          AMVERA_SSH_PRIVATE_KEY: ${{ secrets.AMVERA_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$AMVERA_SSH_PRIVATE_KEY" > ~/.ssh/amvera
          chmod 600 ~/.ssh/amvera
          ssh-keyscan -H git.mia0.amvera.ru >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Push current commit to Amvera master
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/amvera -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
        run: |
          git remote add amvera git@git.mia0.amvera.ru:fedbi/al-fa-otcetn2ie9ju
          git fetch amvera master
          deploy_base=$(git merge-base HEAD FETCH_HEAD)
          unexpected_files=$(git diff --name-only "$deploy_base" FETCH_HEAD -- . ':!amvera.yml')
          if [ -n "$unexpected_files" ]; then
            echo "::error::Amvera contains application changes requiring manual review: $unexpected_files"
            exit 1
          fi
          # The Amvera UI commits runtime settings to its own master branch.
          # Preserve those commits and require a fast-forward push; never force.
          git -c user.name='Alfa deploy' -c user.email='deploy@users.noreply.github.com' \
            merge --no-edit FETCH_HEAD
          git push amvera HEAD:refs/heads/master
