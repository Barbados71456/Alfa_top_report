services:
  - type: web
    name: alfa-report-backend
    env: python
    runtime: python
    pythonVersion: "3.11.0"  # Явно указываем версию
    buildCommand: |
      pip install -r backend/requirements.txt
    startCommand: |
      cd backend && uvicorn main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: alfa-report-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
    autoDeploy: true

databases:
  - name: alfa-report-db
    databaseName: alfa_report_db
    user: alfa_report_user
    plan: free