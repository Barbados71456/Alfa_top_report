services:
  - type: web
    name: finance-analytics
    env: python
    plan: free
    region: frankfurt
    buildCommand: |
      pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production

databases:
  - name: finance_db
    plan: free
    region: frankfurt
    databaseName: finance_db
    user: finance_user