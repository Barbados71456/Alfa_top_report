services:
  # Бэкенд на Python
  - type: web
    name: alfa-report-backend
    env: python
    buildCommand: |
      pip install -r backend/requirements.txt
    startCommand: |
      cd backend && uvicorn main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: alfa-report-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
    healthCheckPath: /docs
    autoDeploy: true

  # Фронтенд (статический)
  - type: web
    name: alfa-report-frontend
    env: static
    buildCommand: |
      echo "Building static frontend..."
    staticPublishPath: ./frontend
    routes:
      - type: rewrite
        source: /api/*
        destination: https://alfa-report-backend.onrender.com/api/*

databases:
  - name: alfa-report-db
    databaseName: alfa_report_db
    user: alfa_report_user
    plan: free