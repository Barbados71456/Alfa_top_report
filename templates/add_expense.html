{% extends "base.html" %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-10 col-xl-8">
            <div class="card">
                <div class="card-header">
                    <h4 class="mb-0"><i class="bi bi-plus-circle"></i> Добавление новой записи</h4>
                </div>
                <div class="card-body">
                    <form method="POST" id="expenseForm">
                        <!-- Дата -->
                        <div class="row mb-3">
                            <div class="col-12 col-md-6">
                                <label for="date" class="form-label">Дата *</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-calendar"></i></span>
                                    <input type="date" class="form-control" id="date" name="date" value="{{ today }}" required>
                                </div>
                            </div>
                        </div>

                        <!-- Признак и Категория -->
                        <div class="row mb-3">
                            <div class="col-12 col-md-6 mb-3 mb-md-0">
                                <label for="sign_id" class="form-label">Признак *</label>
                                <select class="form-select" id="sign_id" name="sign_id" required>
                                    <option value="">Выберите признак</option>
                                    {% for sign in signs %}
                                    <option value="{{ sign.id }}">{{ sign.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            
                            <div class="col-12 col-md-6">
                                <label for="category_id" class="form-label">Категория *</label>
                                <select class="form-select" id="category_id" name="category_id" required disabled>
                                    <option value="">Сначала выберите признак</option>
                                </select>
                            </div>
                        </div>

                        <!-- Статья и Проект -->
                        <div class="row mb-3">
                            <div class="col-12 col-md-6 mb-3 mb-md-0">
                                <label for="article_id" class="form-label">Статья *</label>
                                <select class="form-select" id="article_id" name="article_id" required disabled>
                                    <option value="">Сначала выберите категорию</option>
                                </select>
                            </div>
                            
                            <div class="col-12 col-md-6">
                                <label for="project_id" class="form-label">Проект</label>
                                <select class="form-select" id="project_id" name="project_id">
                                    <option value="">Не выбрано</option>
                                    {% for project in projects %}
                                    <option value="{{ project.id }}">{{ project.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <!-- Контрагент и Тип кошелька -->
                        <div class="row mb-3">
                            <div class="col-12 col-md-6 mb-3 mb-md-0">
                                <label for="counterparty_id" class="form-label">Контрагент</label>
                                <select class="form-select" id="counterparty_id" name="counterparty_id">
                                    <option value="">Не выбрано</option>
                                    {% for counterparty in counterparties %}
                                    <option value="{{ counterparty.id }}">{{ counterparty.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            
                            <div class="col-12 col-md-6">
                                <label for="wallet_type_id" class="form-label">Тип кошелька</label>
                                <select class="form-select" id="wallet_type_id" name="wallet_type_id">
                                    <option value="">Не выбрано</option>
                                    {% for wt in wallet_types %}
                                    <option value="{{ wt.id }}">{{ wt.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <!-- Кошелек и Сумма -->
                        <div class="row mb-3">
                            <div class="col-12 col-md-6 mb-3 mb-md-0">
                                <label for="wallet_id" class="form-label">Кошелек</label>
                                <select class="form-select" id="wallet_id" name="wallet_id" disabled>
                                    <option value="">Сначала выберите тип кошелька</option>
                                </select>
                            </div>
                            
                            <div class="col-12 col-md-6">
                                <label for="amount" class="form-label">Сумма (руб) *</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-currency-ruble"></i></span>
                                    <input type="number" step="0.01" class="form-control" id="amount" name="amount" required>
                                </div>
                            </div>
                        </div>

                        <!-- Комментарии и P&L -->
                        <div class="row mb-4">
                            <div class="col-12 col-md-6 mb-3 mb-md-0">
                                <label for="comments" class="form-label">Комментарии</label>
                                <textarea class="form-control" id="comments" name="comments" rows="3" placeholder="Введите комментарий..."></textarea>
                            </div>
                            
                            <div class="col-12 col-md-6">
                                <label for="pl" class="form-label">P&L</label>
                                <input type="text" class="form-control" id="pl" name="pl" placeholder="PL1">
                            </div>
                        </div>

                        <!-- Кнопки -->
                        <div class="row">
                            <div class="col-12 d-flex justify-content-end gap-2">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-save"></i> Сохранить
                                </button>
                                <a href="{{ url_for('index') }}" class="btn btn-secondary">
                                    <i class="bi bi-x-circle"></i> Отмена
                                </a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
/* Специально для формы добавления */
@media (min-width: 992px) {
    .container.py-4 {
        max-width: 1200px;
    }
    
    .card-body {
        padding: 2rem;
    }
    
    .form-label {
        font-size: 1rem;
        margin-bottom: 0.5rem;
    }
    
    .input-group-text, .form-control, .form-select {
        font-size: 1rem;
        padding: 0.75rem 1rem;
    }
}

@media (max-width: 768px) {
    .card-body {
        padding: 1.5rem;
    }
    
    .form-label {
        font-size: 0.95rem;
    }
    
    .input-group-text, .form-control, .form-select {
        font-size: 16px; /* предотвращает зум на iOS */
        padding: 0.6rem 0.75rem;
    }
    
    .d-flex.justify-content-end {
        flex-direction: column;
    }
    
    .d-flex.justify-content-end .btn {
        width: 100%;
        margin: 0.25rem 0;
    }
}
</style>
{% endblock %}

{% block scripts %}
<script>
$(document).ready(function() {
    // Инициализация Select2 с правильным z-index
    $('#sign_id, #project_id, #counterparty_id, #wallet_type_id').select2({
        theme: 'bootstrap-5',
        language: 'ru',
        width: '100%',
        placeholder: function() {
            return $(this).find('option:first').text();
        },
        allowClear: true,
        dropdownParent: $('body'), // Важно! Прикрепляем к body для правильного отображения
        dropdownCssClass: 'select2-dropdown--above' // Убеждаемся что дропдаун сверху
    });
    
    // Загрузка категорий при выборе признака
    $('#sign_id').change(function() {
        var signId = $(this).val();
        if (signId) {
            $.get('/get_categories/' + signId, function(data) {
                var categorySelect = $('#category_id');
                categorySelect.empty();
                categorySelect.append('<option value="">Выберите категорию</option>');
                $.each(data.categories, function(index, category) {
                    categorySelect.append('<option value="' + category.id + '">' + category.name + '</option>');
                });
                categorySelect.prop('disabled', false);
                categorySelect.select2({
                    theme: 'bootstrap-5',
                    language: 'ru',
                    width: '100%',
                    placeholder: 'Выберите категорию',
                    allowClear: true,
                    dropdownParent: $('body')
                });
            });
        } else {
            $('#category_id').empty().append('<option value="">Сначала выберите признак</option>').prop('disabled', true);
            $('#article_id').empty().append('<option value="">Сначала выберите категорию</option>').prop('disabled', true);
            if ($('#category_id').data('select2')) {
                $('#category_id').select2('destroy');
            }
            if ($('#article_id').data('select2')) {
                $('#article_id').select2('destroy');
            }
        }
    });
    
    // Загрузка статей при выборе категории
    $('#category_id').change(function() {
        var categoryId = $(this).val();
        if (categoryId) {
            $.get('/get_articles/' + categoryId, function(data) {
                var articleSelect = $('#article_id');
                articleSelect.empty();
                articleSelect.append('<option value="">Выберите статью</option>');
                $.each(data.articles, function(index, article) {
                    articleSelect.append('<option value="' + article.id + '">' + article.name + '</option>');
                });
                articleSelect.prop('disabled', false);
                articleSelect.select2({
                    theme: 'bootstrap-5',
                    language: 'ru',
                    width: '100%',
                    placeholder: 'Выберите статью',
                    allowClear: true,
                    dropdownParent: $('body')
                });
            });
        } else {
            $('#article_id').empty().append('<option value="">Сначала выберите категорию</option>').prop('disabled', true);
            if ($('#article_id').data('select2')) {
                $('#article_id').select2('destroy');
            }
        }
    });
    
    // Загрузка кошельков при выборе типа
    $('#wallet_type_id').change(function() {
        var walletTypeId = $(this).val();
        if (walletTypeId) {
            $.get('/get_wallets/' + walletTypeId, function(data) {
                var walletSelect = $('#wallet_id');
                walletSelect.empty();
                walletSelect.append('<option value="">Выберите кошелек</option>');
                $.each(data.wallets, function(index, wallet) {
                    walletSelect.append('<option value="' + wallet.id + '">' + wallet.name + '</option>');
                });
                walletSelect.prop('disabled', false);
                walletSelect.select2({
                    theme: 'bootstrap-5',
                    language: 'ru',
                    width: '100%',
                    placeholder: 'Выберите кошелек',
                    allowClear: true,
                    dropdownParent: $('body')
                });
            });
        } else {
            $('#wallet_id').empty().append('<option value="">Сначала выберите тип кошелька</option>').prop('disabled', true);
            if ($('#wallet_id').data('select2')) {
                $('#wallet_id').select2('destroy');
            }
        }
    });
});
</script>
{% endblock %}
