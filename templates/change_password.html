{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card">
            <div class="card-header text-center">
                <h4 class="mb-0"><i class="bi bi-key"></i> Смена пароля</h4>
            </div>
            <div class="card-body">
                <form method="POST" id="passwordForm">
                    <div class="mb-4">
                        <label for="current_password" class="form-label">Текущий пароль</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="current_password" name="current_password" required>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="new_password" class="form-label">Новый пароль</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-key"></i></span>
                            <input type="password" class="form-control" id="new_password" name="new_password" required minlength="6">
                        </div>
                        <div class="form-text">Минимум 6 символов</div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="confirm_password" class="form-label">Подтверждение пароля</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-key-fill"></i></span>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                        </div>
                        <div class="invalid-feedback" id="passwordMismatch" style="display: none;">
                            Пароли не совпадают
                        </div>
                    </div>
                    
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary flex-grow-1" id="submitBtn">
                            <i class="bi bi-check-circle"></i> Изменить пароль
                        </button>
                        <a href="{{ url_for('index') }}" class="btn btn-secondary">
                            <i class="bi bi-x-circle"></i> Отмена
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
$(document).ready(function() {
    // Проверка совпадения паролей
    $('#new_password, #confirm_password').on('keyup', function() {
        var newPassword = $('#new_password').val();
        var confirmPassword = $('#confirm_password').val();
        
        if (confirmPassword.length > 0) {
            if (newPassword === confirmPassword) {
                $('#confirm_password').removeClass('is-invalid').addClass('is-valid');
                $('#passwordMismatch').hide();
                $('#submitBtn').prop('disabled', false);
            } else {
                $('#confirm_password').removeClass('is-valid').addClass('is-invalid');
                $('#passwordMismatch').show();
                $('#submitBtn').prop('disabled', true);
            }
        } else {
            $('#confirm_password').removeClass('is-valid is-invalid');
            $('#passwordMismatch').hide();
            $('#submitBtn').prop('disabled', false);
        }
    });
    
    // Проверка длины пароля
    $('#new_password').on('keyup', function() {
        if ($(this).val().length < 6 && $(this).val().length > 0) {
            $(this).removeClass('is-valid').addClass('is-invalid');
        } else if ($(this).val().length >= 6) {
            $(this).removeClass('is-invalid').addClass('is-valid');
        } else {
            $(this).removeClass('is-valid is-invalid');
        }
    });
});
</script>
{% endblock %}
