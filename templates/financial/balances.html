<div class="d-flex justify-content-between mb-3">
    <div>
        <button class="btn btn-primary" onclick="showAddModal('balances')">
            <i class="bi bi-plus-circle"></i> Добавить остаток
        </button>
        <button class="btn btn-success" onclick="exportSection('balances')">
            <i class="bi bi-download"></i> Экспорт
        </button>
    </div>
    <input type="file" id="importFileBalances" accept=".xlsx,.xls" style="display:none" onchange="importSection('balances', this.files[0])">
    <button class="btn btn-info" onclick="document.getElementById('importFileBalances').click()">
        <i class="bi bi-upload"></i> Импорт
    </button>
</div>
<div class="table-responsive">
    <table class="table table-hover" id="balancesTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Дата</th>
                <th>Банк</th>
                <th>Портфель</th>
                <th>Сумма (руб.)</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>
