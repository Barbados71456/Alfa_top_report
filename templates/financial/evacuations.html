<div class="d-flex justify-content-between mb-3">
    <div>
        <button class="btn btn-primary" onclick="showAddModal('evacuations')">
            <i class="bi bi-plus-circle"></i> Добавить эвакуацию
        </button>
        <button class="btn btn-success" onclick="exportSection('evacuations')">
            <i class="bi bi-download"></i> Экспорт
        </button>
    </div>
    <input type="file" id="importFileEvacuations" accept=".xlsx,.xls" style="display:none" onchange="importSection('evacuations', this.files[0])">
    <button class="btn btn-info" onclick="document.getElementById('importFileEvacuations').click()">
        <i class="bi bi-upload"></i> Импорт
    </button>
</div>
<div class="table-responsive">
    <table class="table table-hover" id="evacuationsTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Дата</th>
                <th>Контрагент</th>
                <th>Назначение</th>
                <th>Портфель</th>
                <th>Сумма</th>
                <th>Статус</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>
