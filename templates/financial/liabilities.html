<div class="d-flex justify-content-between mb-3">
    <div>
        <button class="btn btn-primary" onclick="showAddModal('liabilities')">
            <i class="bi bi-plus-circle"></i> Добавить обязательство
        </button>
        <button class="btn btn-success" onclick="exportSection('liabilities')">
            <i class="bi bi-download"></i> Экспорт
        </button>
    </div>
    <input type="file" id="importFileLiabilities" accept=".xlsx,.xls" style="display:none" onchange="importSection('liabilities', this.files[0])">
    <button class="btn btn-info" onclick="document.getElementById('importFileLiabilities').click()">
        <i class="bi bi-upload"></i> Импорт
    </button>
</div>
<div class="table-responsive">
    <table class="table table-hover" id="liabilitiesTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Дата создания</th>
                <th>Срок оплаты</th>
                <th>Описание</th>
                <th>Сумма</th>
                <th>Портфель</th>
                <th>Статус</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>
