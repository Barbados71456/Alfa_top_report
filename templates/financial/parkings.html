<div class="d-flex justify-content-between mb-3">
    <div>
        <button class="btn btn-primary" onclick="showAddModal('parkings')">
            <i class="bi bi-plus-circle"></i> Добавить стоянку
        </button>
        <button class="btn btn-success" onclick="exportSection('parkings')">
            <i class="bi bi-download"></i> Экспорт
        </button>
    </div>
    <input type="file" id="importFileParkings" accept=".xlsx,.xls" style="display:none" onchange="importSection('parkings', this.files[0])">
    <button class="btn btn-info" onclick="document.getElementById('importFileParkings').click()">
        <i class="bi bi-upload"></i> Импорт
    </button>
</div>
<div class="table-responsive">
    <table class="table table-hover" id="parkingsTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Дата</th>
                <th>Контрагент</th>
                <th>Период</th>
                <th>Назначение</th>
                <th>Портфель</th>
                <th>Сумма</th>
                <th>Статус</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>
