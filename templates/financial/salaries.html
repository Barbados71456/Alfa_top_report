<div class="d-flex justify-content-between mb-3">
    <div>
        <button class="btn btn-primary" onclick="showAddModal('salaries')">
            <i class="bi bi-plus-circle"></i> Добавить зарплату
        </button>
        <button class="btn btn-success" onclick="exportSection('salaries')">
            <i class="bi bi-download"></i> Экспорт
        </button>
    </div>
    <input type="file" id="importFileSalaries" accept=".xlsx,.xls" style="display:none" onchange="importSection('salaries', this.files[0])">
    <button class="btn btn-info" onclick="document.getElementById('importFileSalaries').click()">
        <i class="bi bi-upload"></i> Импорт
    </button>
</div>
<div class="table-responsive">
    <table class="table table-hover" id="salariesTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Дата</th>
                <th>Портфель</th>
                <th>Сумма</th>
                <th>Сумма налога</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>
