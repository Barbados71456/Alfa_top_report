<div class="d-flex justify-content-between mb-3">
    <div>
        <button class="btn btn-primary" onclick="showAddModal('taxes')">
            <i class="bi bi-plus-circle"></i> Добавить налог
        </button>
        <button class="btn btn-success" onclick="exportSection('taxes')">
            <i class="bi bi-download"></i> Экспорт
        </button>
    </div>
    <input type="file" id="importFileTaxes" accept=".xlsx,.xls" style="display:none" onchange="importSection('taxes', this.files[0])">
    <button class="btn btn-info" onclick="document.getElementById('importFileTaxes').click()">
        <i class="bi bi-upload"></i> Импорт
    </button>
</div>
<div class="table-responsive">
    <table class="table table-hover" id="taxesTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Дата</th>
                <th>Тип налога</th>
                <th>Портфель</th>
                <th>Сумма</th>
                <th>Квартал</th>
                <th>Пени</th>
                <th>Статус</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>
