<div class="d-flex justify-content-between mb-3">
    <div>
        <button class="btn btn-primary" onclick="showAddModal('third_party')">
            <i class="bi bi-plus-circle"></i> Добавить чужие деньги
        </button>
        <button class="btn btn-success" onclick="exportSection('third_party')">
            <i class="bi bi-download"></i> Экспорт
        </button>
    </div>
    <input type="file" id="importFileThirdParty" accept=".xlsx,.xls" style="display:none" onchange="importSection('third_party', this.files[0])">
    <button class="btn btn-info" onclick="document.getElementById('importFileThirdParty').click()">
        <i class="bi bi-upload"></i> Импорт
    </button>
</div>
<div class="table-responsive">
    <table class="table table-hover" id="third_partyTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Дата</th>
                <th>Контрагент</th>
                <th>Назначение</th>
                <th>Портфель</th>
                <th>Сумма</th>
                <th>Срок возврата</th>
                <th>Статус</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>
